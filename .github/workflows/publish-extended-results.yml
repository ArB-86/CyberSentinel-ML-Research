name: Publish extended validation results

on:
  push:
    branches:
      - research/extended-validation
    paths:
      - ".github/workflows/publish-extended-results.yml"

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          ref: research/extended-validation
          fetch-depth: 0

      - name: Download completed experiment artifact
        uses: actions/download-artifact@v4
        with:
          name: cicids2017-extended-validation
          path: experiments/results/scaling-validation-v1
          repository: ${{ github.repository }}
          run-id: 42521225029
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish measured outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/results/scaling-validation-v1/
          if git diff --cached --quiet; then
            echo "No new validation outputs to publish."
          else
            git commit -m "Add extended validation results"
            git push origin HEAD:research/extended-validation
          fi

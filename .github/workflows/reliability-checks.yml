name: Project reliability checks

on:
  push:
    branches:
      - research/project-hardening
  pull_request:
    branches:
      - main
      - research/extended-validation
      - research/project-hardening

concurrency:
  group: project-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile project modules
        run: python -m compileall -q agent attack_graph pages experiments utils app.py risk_analyzer.py

      - name: Smoke-test documented command-line entry points
        run: |
          python attack_graph/if_attack_graph_pipeline.py --help
          python risk_analyzer.py --help
          python experiments/compare_models.py --help
          python experiments/compare_model_scales.py --help
          python experiments/temporal_threshold_optimization.py --help
          python experiments/event_correlation_sensitivity.py --help
          python experiments/isolation_forest_behavioral.py --help

      - name: Run regression tests
        run: pytest -q

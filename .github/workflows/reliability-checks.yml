name: Project reliability checks

on:
  push:
    branches:
      - research/project-hardening
  pull_request:
    branches:
      - main
      - research/extended-validation
      - research/project-hardening

concurrency:
  group: project-hardening-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile project modules
        run: python -m compileall -q agent attack_graph pages app.py risk_analyzer.py

      - name: Run regression tests
        run: pytest -q
